# Example nginx server block (PHP-FPM). Adjust paths, domain and PHP socket.
server {
    listen 80;
    server_name YOUR-DOMAIN.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR-DOMAIN.com;

    ssl_certificate     /etc/letsencrypt/live/YOUR-DOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR-DOMAIN.com/privkey.pem;

    root /var/www/webclip-app;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    types {
        application/x-apple-aspen-config mobileconfig;
        application/manifest+json        webmanifest;
    }

    location ~* \.mobileconfig$ {
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-store";
    }

    location = /app/sw.js { add_header Cache-Control "no-cache"; }

    location ~ ^/(lib|scripts|native-ios|deploy)/ { return 404; }
    location ~ /\. { deny all; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
