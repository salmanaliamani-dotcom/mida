<script>
const LN = TIM.lines, DUR = TIM.dur + 0.6;
let lab = '';

function render(t) {
  const sh = SHOTS.find(s => t >= s[0] && t < s[1]) || SHOTS[SHOTS.length - 1];
  const lt = t - sh[0], D = sh[1] - sh[0]; _gid = 0; _gf = Math.floor(t * 30);

}
